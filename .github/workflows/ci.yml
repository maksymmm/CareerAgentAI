name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov playwright
          python -m playwright install --with-deps chromium

      - name: Run test suite
        run: |
          python -m pytest             --cov=career_agent_ai             --cov-report=term-missing             --cov-fail-under=90

      - name: Build candidate service container
        run: docker build --tag careeragentai:candidate .

      - name: Record immutable candidate image identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          image_id="$(docker image inspect --format '{{.Id}}' careeragentai:candidate)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$source_sha" > source-commit.txt
          printf '%s\n' "$image_id" > candidate-image-digest.txt

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: careeragentai:candidate
          format: spdx-json
          output-file: candidate-sbom.spdx.json
          upload-artifact: false

      - name: Scan candidate image for fixed critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: careeragentai:candidate
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: json
          output-file: candidate-vulnerabilities.json

      - name: Validate and checksum release evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          sbom = json.loads(Path("candidate-sbom.spdx.json").read_text(encoding="utf-8"))
          assert sbom["spdxVersion"] == "SPDX-2.3"
          assert sbom["packages"], "SBOM must contain at least one package"
          report = json.loads(
              Path("candidate-vulnerabilities.json").read_text(encoding="utf-8")
          )
          assert isinstance(report["matches"], list)
          source = Path("source-commit.txt").read_text(encoding="ascii").strip()
          assert len(source) == 40 and all(char in "0123456789abcdef" for char in source)
          digest = Path("candidate-image-digest.txt").read_text(encoding="ascii").strip()
          assert digest.startswith("sha256:") and len(digest) == 71
          PY
          sha256sum \
            source-commit.txt \
            candidate-image-digest.txt \
            candidate-sbom.spdx.json \
            candidate-vulnerabilities.json \
            > release-artifacts.sha256
          sha256sum --check release-artifacts.sha256

      - name: Smoke candidate service container
        shell: bash
        run: |
          set -euo pipefail
          volume=careeragent-candidate-ci-data
          docker volume create "$volume"
          cleanup() {
            docker rm --force careeragent-candidate-ci >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name careeragent-candidate-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=volume,src="$volume",dst=/var/lib/careeragent \
            --publish 127.0.0.1:18080:8080 \
            --env CAREER_AGENT_CANDIDATE_BEARER_TOKEN="$(printf 's%.0s' {1..32})" \
            --env CAREER_AGENT_CANDIDATE_USER_ID=candidate-ci \
            careeragentai:candidate
          test "$(docker exec careeragent-candidate-ci id -u)" = "10001"
          test "$(docker exec careeragent-candidate-ci stat -c %a /var/lib/careeragent)" = "700"
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          for path in ("/healthz", "/readyz"):
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:18080{path}", timeout=2
                      ) as response:
                          assert response.status == 200
                          assert json.load(response) == {"status": "ok"}
                          break
                  except (OSError, urllib.error.URLError):
                      if attempt == 29:
                          raise
                      time.sleep(1)
          PY
          test "$(docker exec careeragent-candidate-ci stat -c %a /var/lib/careeragent/candidate.sqlite)" = "600"

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            source-commit.txt
            candidate-image-digest.txt
            candidate-sbom.spdx.json
            candidate-vulnerabilities.json
            release-artifacts.sha256
          if-no-files-found: error
          retention-days: 30
